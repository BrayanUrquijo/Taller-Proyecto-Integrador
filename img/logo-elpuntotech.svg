<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="logoTitle logoDescription" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logoTitle">Isotipo de ElPuntoTech</title>
  <desc id="logoDescription">Caja de producto con un punto luminoso en la cara superior y circuitos en las caras laterales</desc>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <!-- Caja: cara izquierda, derecha y superior -->
  <path d="M30 47 64 67v39L30 86Z" fill="#1769AA"/>
  <path d="M98 47 64 67v39l34-20Z" fill="#0E4F7F"/>
  <path d="M64 27 98 47 64 67 30 47Z" fill="#38BDF8"/>
  <!-- Circuitos en las caras -->
  <g fill="none" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 66v12l10 6"/>
    <path d="M88 66v12l-10 6"/>
  </g>
  <g fill="#BAE6FD">
    <circle cx="40" cy="62.5" r="3.2"/>
    <circle cx="88" cy="62.5" r="3.2"/>
    <circle cx="53" cy="86" r="2.6"/>
    <circle cx="75" cy="86" r="2.6"/>
  </g>
  <!-- El punto -->
  <circle cx="64" cy="47" r="12" fill="#F8FAFC" fill-opacity=".35"/>
  <circle cx="64" cy="47" r="7" fill="#F8FAFC"/>
  <!-- Separadores de las caras -->
  <path d="M30 47 64 67 98 47M64 67v39" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
